name: Build

on: [ push, pull_request, workflow_dispatch ]

jobs:
  ubuntu:
    ## Building OpenBSM on Linux may have worked at one time but
    ## currently does not, and it is not clear to me why one would
    ## want to.
    if: false
    ##
    name: Ubuntu
    runs-on: ubuntu-latest
    steps:
    - name: Prepare
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool libssl-dev
    - name: Check out
      uses: actions/checkout@v7
    - name: Configure
      run: |
        autoreconf --install
        ./configure
    - name: Build
      run: make
    - name: Distribute
      run: make dist
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
    - name: Prepare
      run: |
        brew update
        brew install autoconf automake libtool openssl@3
    - name: Check out
      uses: actions/checkout@v7
    - name: Configure
      run: |
        autoreconf --install
        ./configure \
            CPPFLAGS="-I$(brew --prefix openssl@3)/include" \
            LDFLAGS="-L$(brew --prefix openssl@3)/lib" 
    - name: Build
      run: make
    - name: Distribute
      run: make dist
